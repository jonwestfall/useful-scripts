# Podium behind nginx. Replace podium.example.com throughout.
#
# Notably shorter than it used to have to be. When authentication was HTTP
# Basic Auth this file carried a pile of `auth_basic off` exceptions - for
# favicons, because Apple's icon discovery does not reliably reuse credentials;
# for the webmanifests and PWA icons, because Safari raises a native prompt on
# background fetches; for the service worker, because a worker that returns 401
# leaves Safari with no way to show a prompt at all. Podium now authenticates
# with a session cookie, and browsers attach cookies to every same-origin
# request without being asked, so none of that is needed: there is one gate,
# it is in the application, and nginx just proxies.
#
# Nothing here should set auth_basic. If you leave it on you get two logins,
# and the WebSocket exemption that used to be necessary becomes a hole - the
# app gates the relay socket on the same cookie now (see podium-server.js).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name podium.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name podium.example.com;

    ssl_certificate     /etc/letsencrypt/live/podium.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podium.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads are capped at 50 MB in the application; nginx has to agree or it
    # will reject the body before Podium ever sees it. A little headroom for
    # the multipart envelope.
    client_max_body_size 56m;

    # Podium serves its own icons and manifests, and there is nothing to
    # exempt any more - but a browser asking for /favicon.ico on the audience
    # page should not cost a round trip to Node for a 404 it will get anyway.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # The audience page and the poll API. Open by design, and open in the
    # application too: a room full of students has no account and must never
    # need one. proxy_buffering off is not optional - the question feed is an
    # event stream, and a buffered one arrives when the buffer fills rather
    # than when the question changes.
    location ~ ^/poll(?:/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Podium reads these two: the first to rate-limit logins by origin
        # rather than by "127.0.0.1, all of them", the second to decide
        # whether the session cookie may be marked Secure.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long enough for a lecture's worth of silence on the relay socket;
        # the server's own heartbeat is every 25s, so this is generous.
        proxy_read_timeout 75s;
    }
}
