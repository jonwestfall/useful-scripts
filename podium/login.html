<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Sign in — Podium</title>
<!-- Self-contained on purpose, exactly like join.html and for a sharper
     reason: this is the page that gets you THROUGH the gate, so nothing it
     needs may sit behind it. No stylesheet, no module, no shared asset - one
     file, which is the only thing the server has to leave open besides the
     audience page.

     A page and not a browser prompt, because HTTP Basic Auth is what this
     replaces: Safari raises native dialogs on background fetches of icons and
     webmanifests, will not show one at all when a service worker is in the
     way, and cannot attach credentials to a WebSocket handshake. A cookie has
     none of those problems. See VPS.md. -->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #151a21; --line: #273040; --ink: #e8ecf2;
    --dim: #93a0b4; --accent: #4c8dff; --button: #2b66d9; --field: #0f141b; --picked: #10251d; --bad: #ff9d9d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --panel: #ffffff; --line: #d7dde5; --ink: #121821;
    --dim: #4f5b6b; --accent: #1f5fcc; --button: #1f5fcc; --field: #ffffff; --bad: #b42318;
  }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; width: auto; margin: 0; min-height: 0;
    padding: 6px 10px; font-size: 16px; line-height: 1; font-weight: 400;
    background: var(--panel); border-color: var(--line); color: var(--dim);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 24rem; margin-inline: auto;
  }
  .brand { font-weight: 700; letter-spacing: .18em; font-size: 15px; color: var(--dim); }
  h1 { font-size: 21px; margin: 10px 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 14px; color: var(--dim); margin: 12px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input, button {
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    width: 100%; -webkit-appearance: none;
  }
  button {
    background: var(--button); border-color: var(--button); color: #fff;
    font-weight: 600; cursor: pointer; margin-top: 18px; min-height: 48px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .note { margin: 14px 0 0; font-size: 14px; color: var(--dim); min-height: 1.4em; }
  .note.bad { color: var(--bad); }
  .foot { margin-top: 20px; font-size: 13px; color: var(--dim); text-align: center; }
</style>
<script>
// Light or dark, as chosen for every Podium page in this browser - inline,
// like everything else this page needs (see theme-boot.js for the shared one).
(function () {
  try {
    var choice = localStorage.getItem('podium.theme');
    if (choice !== 'light' && choice !== 'dark') {
      choice = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = choice;
  } catch (_e) { /* storage blocked: dark */ }
}());
</script>
</head>
<body>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme: light or dark">◐</button>

<p class="brand">PODIUM</p>
<h1>Sign in</h1>

<form id="form" class="card">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none"
         autocorrect="off" spellcheck="false" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button id="go" type="submit">Sign in</button>
  <p class="note" id="note" role="status"></p>
</form>

<p class="foot">Answering a poll? You do not need an account —<br>open the join page and enter the code on the screen.</p>

<script>
(function () {
  var form = document.getElementById('form');
  var note = document.getElementById('note');
  var go = document.getElementById('go');

  // Where to land afterwards. Read here only to be sent back to the server,
  // which validates it again - a redirect target that came out of a query
  // string is exactly the kind of thing that turns a login into an open
  // redirect, so neither end trusts it on its own.
  var next = new URLSearchParams(location.search).get('next') || '';

  function say(text, bad) {
    note.textContent = text;
    note.className = 'note' + (bad ? ' bad' : '');
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    go.disabled = true;
    say('Signing in…', false);
    fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        next: next,
      }),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.ok) { location.replace(body.next || '/index.html'); return; }
        go.disabled = false;
        say(body.error || 'That did not work.', true);
        document.getElementById('password').value = '';
      });
    }).catch(function () {
      go.disabled = false;
      say('Could not reach the server.', true);
    });
  });

  document.getElementById('username').focus();
})();
</script>
<script>
// The ☀ / ☾ / ◐ button: Dark, Light or Follow this device, shared with every
// Podium page in this browser (theme.js does the same on the others).
(function () {
  var button = document.getElementById('theme-toggle');
  if (!button) return;
  var order = ['auto', 'light', 'dark'];
  var icons = { auto: '◐', light: '☀', dark: '☾' };
  var names = { auto: 'Follow this device', light: 'Light', dark: 'Dark' };
  function choice() {
    try { var c = localStorage.getItem('podium.theme'); return order.indexOf(c) >= 0 ? c : 'auto'; } catch (_e) { return 'auto'; }
  }
  function paint() {
    var c = choice();
    var light = c === 'light' || (c === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    button.textContent = icons[c];
    button.setAttribute('aria-label', 'Theme: ' + names[c]);
    button.title = 'Theme: ' + names[c];
  }
  button.addEventListener('click', function () {
    var next = order[(order.indexOf(choice()) + 1) % order.length];
    try { localStorage.setItem('podium.theme', next); } catch (_e) { /* this visit only */ }
    paint();
  });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', paint);
  paint();
}());
</script>
</body>
</html>
