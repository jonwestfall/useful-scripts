name: Podium tests

# Scoped to podium/ so a change anywhere else in this grab-bag repo (the
# other scripts living alongside it) never triggers a Podium test run.
on:
  push:
    branches: [main, podium-beta]
    paths:
      - 'podium/**'
      - '.github/workflows/podium-tests.yml'
  pull_request:
    paths:
      - 'podium/**'
      - '.github/workflows/podium-tests.yml'

jobs:
  unit:
    name: Unit tests (protocol, plan, store)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 or newer: the server's storage uses the built-in node:sqlite.
          node-version: 22
      - run: node test/protocol.test.mjs
        working-directory: podium
      - run: node test/plan.test.mjs
        working-directory: podium
      - run: node test/store.test.mjs
        working-directory: podium
      # The scripts nobody runs until the day they are needed, which is the
      # worst day to find a typo in one.
      - name: Check the deploy scripts parse
        run: bash -n deploy/install.sh deploy/update.sh deploy/backup.sh deploy/restore.sh
        working-directory: podium

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the relay's own dependency
        run: npm ci
        working-directory: podium/server
      - name: Install Playwright and Chromium
        # Pinned rather than "latest": there is no lockfile for this ad-hoc
        # install, so an unpinned version drifts to whatever Playwright ships
        # on the day a run happens to fire, browser included - which is how
        # this pin came to exist (a newer Chromium's headless mode enforces
        # window-state rules the suite had not been run against). Bump this
        # deliberately, not as a side effect of an unrelated change.
        run: |
          rm -rf node_modules/playwright node_modules/playwright-core
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
        working-directory: podium
      - name: Run the end-to-end suite
        run: node test/e2e.mjs
        working-directory: podium
