name: Podium tests

# Scoped to podium/ so a change anywhere else in this grab-bag repo (the
# other scripts living alongside it) never triggers a Podium test run.
on:
  push:
    branches: [main, podium-beta]
    paths:
      - 'podium/**'
      - '.github/workflows/podium-tests.yml'
  pull_request:
    paths:
      - 'podium/**'
      - '.github/workflows/podium-tests.yml'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ESLint
        # Pinned rather than "latest", the same as the e2e job's Playwright
        # install below: there is no lockfile for this ad-hoc install, and
        # nothing here is committed to the repo (see eslint.config.mjs's own
        # header comment) - an unpinned version drifts to whatever ships on
        # the day a run happens to fire. Bump deliberately, not as a side
        # effect of an unrelated change.
        run: npm install eslint@10.11.0 @eslint/js@10.0.1 globals@17.12.0
        working-directory: podium
      - name: Run ESLint
        run: npx eslint .
        working-directory: podium

  unit:
    name: Unit tests (all test/*.test.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 or newer: the server's storage uses the built-in node:sqlite.
          node-version: 22
      # relay.test.mjs spawns the real relay process, which needs its one
      # dependency (ws) on disk - server/node_modules is gitignored, so a
      # fresh checkout has nothing here until this runs.
      - name: Install the relay's own dependency
        run: npm ci
        working-directory: podium/server
      # Every fast Node-native suite in test/, not a hand-picked subset - a
      # new *.test.mjs file is covered automatically, with no separate line
      # to remember to add here (see Issue #111: this list used to be three
      # files, and the other dozen silently never ran in CI).
      - name: Run every unit test
        run: |
          set -e
          for f in test/*.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
        working-directory: podium
      # The scripts nobody runs until the day they are needed, which is the
      # worst day to find a typo in one.
      - name: Check the deploy scripts parse
        run: bash -n deploy/install.sh deploy/update.sh deploy/backup.sh deploy/restore.sh
        working-directory: podium

  # One runner per group (see test/e2e/): each starts its own relay and
  # browser, so the groups are independent, run side by side, and a failure
  # in one does not hide the results of the others.
  e2e-group:
    name: End-to-end (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [core, ink-layout, media, polls-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the relay's own dependency
        run: npm ci
        working-directory: podium/server
      - name: Install Playwright and Chromium
        # Pinned rather than "latest": there is no lockfile for this ad-hoc
        # install, so an unpinned version drifts to whatever Playwright ships
        # on the day a run happens to fire, browser included - which is how
        # this pin came to exist (a newer Chromium's headless mode enforces
        # window-state rules the suite had not been run against). Bump this
        # deliberately, not as a side effect of an unrelated change.
        run: |
          rm -rf node_modules/playwright node_modules/playwright-core
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
        working-directory: podium
      - name: Run the end-to-end group
        run: node test/e2e/${{ matrix.group }}.mjs
        working-directory: podium

  # The single check a branch ruleset can require, under the name the suite
  # has always reported as: green only when every group above is.
  e2e:
    name: End-to-end (Playwright)
    needs: e2e-group
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every group passed
        run: test "${{ needs.e2e-group.result }}" = success
