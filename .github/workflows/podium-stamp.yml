name: Podium build stamp

# Automatically bump the build number and stamp the triggering commit hash
# into protocol.js and join.html whenever code lands on main or podium-beta.
#
# The stamp commit uses [skip ci] so it never re-triggers this workflow (or
# the test workflow) into doing real work; the `if:` condition below is what
# actually enforces that, not the push itself.
#
# main is protected by a ruleset requiring changes through a pull request,
# and GITHUB_TOKEN (the github-actions[bot] identity) cannot be added to a
# ruleset's bypass list - it isn't a selectable App, team, or role there, on
# this repo or any other. STAMP_PUSH_TOKEN is a PAT belonging to a real
# repository admin, whose "Repository admin" role IS on that bypass list, so
# authenticating with it is what lets this push land directly. See
# https://github.com/jonwestfall/useful-scripts/actions/runs/35671931986 for
# what it looks like when this token is missing or expired: the stamp commit
# itself succeeds locally, only the push is rejected.
#
# A PAT push does re-trigger this workflow (unlike GITHUB_TOKEN's push,
# which deliberately does not) - harmless, since the run it triggers sees
# [skip ci] in the very commit it would otherwise re-stamp and exits via the
# `if:` condition below without doing anything.

on:
  push:
    branches: [main, podium-beta]
    paths:
      - 'podium/**'
      - '.github/workflows/podium-stamp.yml'

jobs:
  stamp:
    name: Bump build number
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3

    # Never stamp a stamp — the previous run's own commit contains [skip ci]
    # in the message, but the on.push filter alone does not honour that; this
    # condition does.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full ref so we can push back to it.
          ref: ${{ github.ref }}
          # A repo-admin PAT, not the default GITHUB_TOKEN - see the header
          # comment above for why main's ruleset needs this. Falls back to
          # GITHUB_TOKEN if the secret is ever unset, so podium-beta (which
          # has no such ruleset) keeps working even without it configured.
          token: ${{ secrets.STAMP_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp build
        run: node scripts/stamp-build.mjs --commit "${{ github.sha }}"
        working-directory: podium

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podium/assets/js/protocol.js podium/join.html
          # If stamp-build.mjs made no changes (shouldn't happen, but be safe),
          # skip the commit rather than failing.
          if git diff --cached --quiet; then
            echo "Nothing to stamp — files unchanged."
            exit 0
          fi
          BUILD=$(grep -oP 'BUILD = \K\d+' podium/assets/js/protocol.js)
          git commit -m "chore: stamp build ${BUILD} [skip ci]"
          git push
